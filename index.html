<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoLife - 人生回声机</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="./echarts.min.js"></script>
<style>
/* ========== 主题变量系统 ========== */
:root {
  --primary: #7B8FA1;
  --primary-light: #A4B4C2;
  --primary-dark: #657585;
  --bg: #F5F0EB;
  --bg-soft: #EFE9E2;
  --card: #EAE3DC;
  --card-solid: #EAE3DC;
  --text: #3A3530;
  --text-light: #8A8279;
  --border: #D8D2CA;
  --mood-happy: #ffeaa7;
  --mood-calm: #dfe6e9;
  --mood-sad: #b2bec3;
  --mood-anxious: #fab1a0;
  --accent-warm: #D4A574;
  --shadow: 0 2px 12px rgba(123,143,161,0.08);
  --shadow-hover: 0 6px 24px rgba(123,143,161,0.16);
  --radius: 16px;
  --card-blur: 0px;
  --card-opacity: 1;
  --header-grad: linear-gradient(135deg, #7B8FA1, #A4B4C2);
}

/* 主题：暖琥珀 */
[data-theme="amber"] {
  --primary: #C4956A;
  --primary-light: #DDB58A;
  --primary-dark: #A87A52;
  --bg: #FAF5EF;
  --bg-soft: #F2E9DD;
  --card: #EFE3D2;
  --card-solid: #EFE3D2;
  --text: #3D2F22;
  --text-light: #8A7560;
  --border: #E0D2BE;
  --accent-warm: #B8763F;
  --shadow: 0 2px 12px rgba(196,149,106,0.10);
  --shadow-hover: 0 6px 24px rgba(196,149,106,0.18);
  --header-grad: linear-gradient(135deg, #C4956A, #DDB58A);
}

/* 主题：樱粉 */
[data-theme="sakura"] {
  --primary: #C98DA6;
  --primary-light: #E0AEc2;
  --primary-dark: #A66B85;
  --bg: #FBF3F5;
  --bg-soft: #F5E7EB;
  --card: #F0E0E5;
  --card-solid: #F0E0E5;
  --text: #3D2A33;
  --text-light: #8A6B78;
  --border: #E4CFD6;
  --accent-warm: #D4A574;
  --shadow: 0 2px 12px rgba(201,141,166,0.10);
  --shadow-hover: 0 6px 24px rgba(201,141,166,0.18);
  --header-grad: linear-gradient(135deg, #C98DA6, #E0AEc2);
}

/* 主题：深夜模式 */
[data-theme="dark"] {
  --primary: #8FA5B8;
  --primary-light: #B0C2D0;
  --primary-dark: #6F8596;
  --bg: #1E2128;
  --bg-soft: #252932;
  --card: #2A2E37;
  --card-solid: #2A2E37;
  --text: #E0DCD3;
  --text-light: #9A938A;
  --border: #3A3F4A;
  --mood-happy: #FFE08A;
  --mood-calm: #B8C5CC;
  --mood-sad: #7A8088;
  --mood-anxious: #FFB39E;
  --accent-warm: #D4A574;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-hover: 0 6px 24px rgba(0,0,0,0.45);
  --header-grad: linear-gradient(135deg, #3A4150, #2A2E37);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.5s ease, color 0.5s ease;
}

/* ========== 背景图层 ========== */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-color: var(--bg);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: background-color 0.5s ease;
}

/* ========== 应用容器 ========== */
.app-container {
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: 84px;
}

/* ========== 头部 ========== */
.app-header {
  padding: 24px 20px 18px;
  text-align: center;
  background: var(--header-grad);
  color: white;
  position: relative;
  overflow: hidden;
}

.app-header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 24px;
  background: linear-gradient(to bottom, transparent, var(--bg));
  pointer-events: none;
}

.app-header h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 3px;
  text-shadow: 0 1px 8px rgba(0,0,0,0.08);
}

.app-header .subtitle {
  font-size: 12px;
  opacity: 0.88;
  margin-top: 5px;
  letter-spacing: 2px;
  font-weight: 300;
}

.header-actions {
  position: absolute;
  top: 18px;
  right: 14px;
  display: flex;
  gap: 6px;
  z-index: 2;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

.icon-btn:hover {
  background: rgba(255,255,255,0.32);
  transform: rotate(45deg);
}

.icon-btn svg {
  width: 17px;
  height: 17px;
  fill: currentColor;
}

/* ========== Tab页面 ========== */
.tab-page {
  display: none;
  padding: 16px;
}

.tab-page.active {
  display: block;
}

/* ========== 卡片通用样式（毛玻璃） ========== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: box-shadow 0.35s, transform 0.35s, background 0.5s;
  -webkit-backdrop-filter: blur(var(--card-blur));
  backdrop-filter: blur(var(--card-blur));
  opacity: var(--card-opacity);
  border: 1px solid rgba(255,255,255,0.18);
}

.card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.5px;
}

.card-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 18px;
  background: var(--primary);
  border-radius: 2px;
}

/* ========== 底部导航栏 ========== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: var(--card-solid);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 6px 14px;
  border-radius: 12px;
  transition: all 0.25s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}

.nav-item svg {
  width: 22px;
  height: 22px;
  fill: var(--text-light);
  transition: fill 0.25s, transform 0.25s;
}

.nav-item span {
  font-size: 11px;
  color: var(--text-light);
  transition: color 0.25s;
}

.nav-item.active svg {
  fill: var(--primary);
  transform: translateY(-1px);
}

.nav-item.active span {
  color: var(--primary);
  font-weight: 600;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  top: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 22px;
  height: 3px;
  background: var(--primary);
  border-radius: 2px;
  opacity: 0.5;
}

.nav-item:active {
  transform: scale(0.92);
}

/* ========== PC 大屏：底部导航改为左侧边栏 ========== */
@media (min-width: 768px) {
  .bottom-nav {
    top: 0;
    bottom: 0;
    left: 0;
    width: 72px;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    padding: 20px 0;
    border-top: none;
    border-right: 1px solid var(--border);
  }

  .nav-item {
    flex-direction: column;
    padding: 10px 6px;
    border-radius: 14px;
    margin: 0 8px;
    gap: 4px;
  }

  .nav-item svg {
    width: 24px;
    height: 24px;
  }

  .nav-item span {
    font-size: 10px;
  }

  .nav-item.active::before {
    top: 50%;
    left: 4px;
    transform: translateY(-50%);
    width: 3px;
    height: 18px;
    border-radius: 2px;
    opacity: 0.5;
  }

  .app-container {
    padding-left: 72px;
    padding-bottom: 0;
  }

  .app-header {
    border-radius: 0;
  }
}

/* ========== 原底部导航栏（移动端） ========== */

/* ========== 微记录模块 ========== */
.mood-selector {
  display: flex;
  gap: 10px;
  margin: 14px 0 18px;
  justify-content: center;
}

.mood-btn {
  width: 52px;
  height: 52px;
  border: 2px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: var(--bg-soft);
}

.mood-btn:hover {
  transform: scale(1.12) rotate(-5deg);
}

.mood-btn.selected {
  border-color: var(--primary);
  background: rgba(123,143,161,0.12);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(123,143,161,0.18);
}

.mood-label {
  font-size: 11px;
  color: var(--text-light);
  text-align: center;
  margin-top: 5px;
  transition: color 0.25s;
}

.mood-item.selected .mood-label {
  color: var(--primary);
  font-weight: 600;
}

.mood-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.text-input {
  width: 100%;
  min-height: 80px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  background: var(--bg-soft);
  color: var(--text);
}

.text-input:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(123,143,161,0.12);
}

.text-input::placeholder {
  color: var(--text-light);
  opacity: 0.6;
}

.btn-primary {
  width: 100%;
  padding: 13px;
  background: var(--header-grad);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 14px;
  font-family: inherit;
  letter-spacing: 2px;
  box-shadow: 0 2px 8px rgba(123,143,161,0.2);
}

.btn-primary:hover {
  box-shadow: 0 6px 18px rgba(123,143,161,0.4);
  transform: translateY(-1px);
}

.btn-primary:active {
  transform: translateY(0);
}

/* 记录列表 */
.record-list {
  margin-top: 8px;
}

.record-item {
  display: flex;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.record-item:last-child {
  border-bottom: none;
}

.record-mood {
  font-size: 28px;
  flex-shrink: 0;
  width: 40px;
  text-align: center;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.06));
}

.record-content {
  flex: 1;
  min-width: 0;
}

.record-text {
  font-size: 14px;
  line-height: 1.65;
  word-break: break-word;
  color: var(--text);
}

.record-time {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

.record-delete {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--text-light);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 6px;
  border-radius: 6px;
  transition: all 0.2s;
  opacity: 0.4;
}

.record-item:hover .record-delete {
  opacity: 1;
}

.record-delete:hover {
  color: #d63031;
  background: rgba(214,48,49,0.08);
}

/* ========== 空状态 ========== */
.empty-tip {
  text-align: center;
  color: var(--text-light);
  padding: 36px 16px;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.empty-tip svg {
  width: 64px;
  height: 64px;
  opacity: 0.4;
}

.empty-tip .empty-text {
  line-height: 1.7;
}

/* ========== 情绪时间轴模块 ========== */
.chart-container {
  width: 100%;
  height: 280px;
  margin-bottom: 12px;
}

.stat-summary {
  background: linear-gradient(135deg, rgba(123,143,161,0.08), rgba(164,180,194,0.05));
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  font-size: 14px;
  line-height: 1.9;
  color: var(--text);
  border: 1px solid var(--border);
}

.stat-summary strong {
  color: var(--primary);
  font-weight: 600;
}

/* ========== 时间胶囊模块 ========== */
.capsule-editor textarea {
  width: 100%;
  min-height: 120px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  background: var(--bg-soft);
  color: var(--text);
}

.capsule-editor textarea:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(123,143,161,0.12);
}

.capsule-date-selector {
  display: flex;
  gap: 8px;
  margin: 14px 0;
  flex-wrap: wrap;
}

.date-btn {
  padding: 8px 16px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: var(--bg-soft);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s;
  font-family: inherit;
  color: var(--text);
}

.date-btn:hover {
  border-color: var(--primary-light);
  transform: translateY(-1px);
}

.date-btn.selected {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
  box-shadow: 0 3px 10px rgba(123,143,161,0.3);
}

.custom-date-input {
  display: none;
  margin-top: 8px;
}

.custom-date-input input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  background: var(--bg-soft);
  color: var(--text);
}

.custom-date-input input:focus {
  border-color: var(--primary-light);
}

.capsule-list {
  margin-top: 12px;
}

.capsule-item {
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 12px;
  border: 1.5px solid var(--border);
  background: var(--bg-soft);
  transition: all 0.3s;
}

.capsule-item:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.capsule-item.ready {
  border-color: var(--accent-warm);
  background: linear-gradient(135deg, rgba(212,165,116,0.12), rgba(212,165,116,0.04));
}

.capsule-status {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.capsule-status .badge {
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.badge-pending {
  background: var(--mood-calm);
  color: var(--text-light);
}

.badge-ready {
  background: var(--accent-warm);
  color: white;
}

.badge-read {
  background: var(--mood-happy);
  color: var(--text-light);
}

.capsule-content {
  font-size: 14px;
  line-height: 1.75;
  color: var(--text);
  display: none;
  padding: 12px;
  background: var(--bg-soft);
  border-radius: 8px;
  border-left: 3px solid var(--accent-warm);
}

.capsule-content.show {
  display: block;
}

.capsule-preview {
  font-size: 13px;
  color: var(--text-light);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-style: italic;
}

.btn-open-capsule {
  margin-top: 12px;
  padding: 8px 22px;
  background: var(--accent-warm);
  color: white;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
  font-weight: 600;
  letter-spacing: 1px;
}

.btn-open-capsule:hover {
  box-shadow: 0 4px 14px rgba(212,165,116,0.4);
  transform: translateY(-1px);
}

/* ========== Echo Report 模块 ========== */
.report-chart {
  width: 100%;
  height: 260px;
}

.ai-summary {
  background: linear-gradient(135deg, rgba(123,143,161,0.08), rgba(164,180,194,0.05));
  border-radius: 12px;
  padding: 20px;
  margin-top: 16px;
  line-height: 1.9;
  font-size: 14px;
  color: var(--text);
  position: relative;
  border: 1px solid var(--border);
}

.ai-summary::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 20px;
  right: 20px;
  height: 3px;
  background: var(--header-grad);
  border-radius: 0 0 3px 3px;
}

.ai-summary .ai-label {
  font-size: 12px;
  color: var(--primary);
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ai-summary .ai-label::before {
  content: '✦';
  font-size: 14px;
}

.keyword-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.keyword-tag {
  padding: 6px 14px;
  background: rgba(123,143,161,0.1);
  color: var(--primary-dark);
  border-radius: 16px;
  font-size: 13px;
  transition: all 0.25s;
  cursor: default;
}

.keyword-tag:hover {
  background: rgba(123,143,161,0.18);
  transform: translateY(-1px);
}

.keyword-tag .count {
  color: var(--text-light);
  margin-left: 4px;
  font-size: 12px;
}

/* ========== 人生时间轴模块 ========== */
.life-timeline {
  position: relative;
  padding-left: 24px;
}

.life-timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--primary), var(--primary-light), var(--border));
}

.timeline-node {
  position: relative;
  margin-bottom: 18px;
  padding: 14px 16px;
  background: var(--bg-soft);
  border-radius: 12px;
  border: 1px solid var(--border);
  transition: transform 0.25s;
}

.timeline-node:hover {
  transform: translateX(2px);
}

.timeline-node::before {
  content: '';
  position: absolute;
  left: -20px;
  top: 18px;
  width: 10px;
  height: 10px;
  background: var(--primary);
  border-radius: 50%;
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 2px var(--primary-light);
}

.timeline-date {
  font-size: 12px;
  color: var(--primary);
  font-weight: 600;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

.timeline-text {
  font-size: 14px;
  line-height: 1.65;
  color: var(--text);
}

.timeline-mood {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 6px;
}

.btn-export {
  width: 100%;
  padding: 12px;
  background: var(--bg-soft);
  color: var(--primary);
  border: 1.5px solid var(--primary);
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 20px;
  font-family: inherit;
  letter-spacing: 2px;
}

.btn-export:hover {
  background: var(--primary);
  color: white;
  box-shadow: 0 4px 15px rgba(123,143,161,0.3);
  transform: translateY(-1px);
}

/* ========== 设置中心弹窗 ========== */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.modal-mask.show {
  display: flex;
}

.modal {
  background: var(--card-solid);
  border-radius: 20px;
  width: 92%;
  max-width: 420px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.modal-header {
  padding: 20px 22px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card-solid);
  z-index: 1;
}

.modal-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 1px;
}

.modal-close {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: var(--bg-soft);
  color: var(--text-light);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s;
}

.modal-close:hover {
  background: rgba(214,48,49,0.1);
  color: #d63031;
  transform: rotate(90deg);
}

.modal-body {
  padding: 16px 22px 22px;
}

.setting-group {
  margin-bottom: 22px;
}

.setting-group:last-child {
  margin-bottom: 0;
}

.setting-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 10px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.setting-label::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--primary);
  border-radius: 2px;
}

.setting-hint {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 6px;
  line-height: 1.5;
}

/* 主题选择 */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.theme-card {
  padding: 14px;
  border-radius: 12px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}

.theme-card:hover {
  transform: translateY(-2px);
}

.theme-card.selected {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(123,143,161,0.15);
}

.theme-card .theme-preview {
  height: 36px;
  border-radius: 8px;
  margin-bottom: 8px;
  display: flex;
  overflow: hidden;
}

.theme-card .theme-preview span {
  flex: 1;
}

.theme-card .theme-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  text-align: center;
}

.theme-card .theme-check {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  font-size: 12px;
  display: none;
  align-items: center;
  justify-content: center;
}

.theme-card.selected .theme-check {
  display: flex;
}

/* 背景类型选择 */
.bg-type-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.bg-type-btn {
  flex: 1;
  padding: 9px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: var(--bg-soft);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s;
  color: var(--text);
  font-family: inherit;
}

.bg-type-btn.selected {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* 颜色选择器 */
.color-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.color-row input[type="color"] {
  width: 44px;
  height: 36px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  background: var(--bg-soft);
  padding: 2px;
}

.color-row input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.color-row input[type="color"]::-webkit-color-swatch {
  border: none;
  border-radius: 6px;
}

.color-row .color-text {
  flex: 1;
  font-size: 13px;
  color: var(--text-light);
  font-family: 'JetBrains Mono', 'Consolas', monospace;
}

/* 文件上传 */
.file-upload {
  display: block;
  padding: 18px;
  border: 1.5px dashed var(--border);
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  color: var(--text-light);
  font-size: 13px;
}

.file-upload:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: rgba(123,143,161,0.04);
}

.file-upload input {
  display: none;
}

.file-upload svg {
  width: 22px;
  height: 22px;
  margin-bottom: 6px;
  fill: currentColor;
}

.file-upload.has-file {
  border-color: var(--primary);
  color: var(--primary);
  border-style: solid;
}

/* 滑块 */
.slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.slider-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
}

.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  background: var(--primary);
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  transition: transform 0.2s;
}

.slider-row input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.15);
}

.slider-row .slider-value {
  min-width: 42px;
  text-align: right;
  font-size: 13px;
  color: var(--primary);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-family: 'JetBrains Mono', 'Consolas', monospace;
}

/* 开关 */
.switch-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
}

.switch-row .switch-label {
  font-size: 14px;
  color: var(--text);
}

.switch {
  position: relative;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
}

.switch input {
  display: none;
}

.switch-slider {
  position: absolute;
  inset: 0;
  background: var(--border);
  border-radius: 24px;
  cursor: pointer;
  transition: background 0.3s;
}

.switch-slider::before {
  content: '';
  position: absolute;
  left: 3px;
  top: 3px;
  width: 18px;
  height: 18px;
  background: white;
  border-radius: 50%;
  transition: transform 0.3s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

.switch input:checked + .switch-slider {
  background: var(--primary);
}

.switch input:checked + .switch-slider::before {
  transform: translateX(20px);
}

/* 设置按钮组 */
.setting-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.btn-secondary {
  flex: 1;
  padding: 10px;
  background: var(--bg-soft);
  color: var(--text-light);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.25s;
}

.btn-secondary:hover {
  background: rgba(214,48,49,0.08);
  color: #d63031;
  border-color: #d63031;
}

.btn-primary-sm {
  flex: 1;
  padding: 10px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  transition: all 0.25s;
}

.btn-primary-sm:hover {
  box-shadow: 0 4px 12px rgba(123,143,161,0.3);
}

/* ========== Toast 提示 ========== */
.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  background: rgba(45,52,54,0.92);
  color: white;
  padding: 10px 24px;
  border-radius: 22px;
  font-size: 14px;
  z-index: 400;
  pointer-events: none;
  max-width: 300px;
  text-align: center;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  visibility: hidden;
  opacity: 0;
}

/* ========== 滚动条美化 ========== */
::-webkit-scrollbar {
  width: 5px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--primary-light);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--primary);
}

/* ========== 响应式 ========== */
@media (min-width: 481px) {
  body {
    background: var(--bg-soft);
  }
  .app-container {
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .bottom-nav {
    box-shadow: 0 -2px 14px rgba(0,0,0,0.05);
  }
}
</style>
</head>

<script>
/* ================================================================
   EchoLife - 人生回声机

   数据存储：IndexedDB  |  设置存储：localStorage

const MOOD_MAP = { 1: '😊', 2: '😐', 3: '😔', 4: '😤' };

const SETTINGS_KEY = 'echolife_settings';

const DEFAULT_SETTINGS = {

// ==================== 设置系统 ====================
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return { ...DEFAULT_SETTINGS };
    return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
  } catch (e) {
    return { ...DEFAULT_SETTINGS };
  }
}

function saveSettings(settings) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function applySettings(settings) {
  if (settings.theme === 'fog') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', settings.theme);
  }

  const bgLayer = document.getElementById('bgLayer');
  if (settings.bgType === 'color') {
    bgLayer.style.background = settings.bgColor;
  } else if (settings.bgType === 'image' && settings.bgImage) {
    bgLayer.style.background = `url('${settings.bgImage}') center/cover no-repeat`;
  } else {
    bgLayer.style.background = '';
    bgLayer.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--bg');
  }

  document.documentElement.style.setProperty('--card-blur', settings.blur + 'px');
  document.documentElement.style.setProperty('--card-opacity', settings.opacity / 100);
}

// ==================== IndexedDB 初始化 ====================
function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      db = request.result;
      resolve(db);
    };
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('records')) {
        const recordStore = database.createObjectStore('records', {
          keyPath: 'id',
          autoIncrement: true
        });
        recordStore.createIndex('timestamp', 'timestamp', { unique: false });
      }
      if (!database.objectStoreNames.contains('capsules')) {
        const capsuleStore = database.createObjectStore('capsules', {
          keyPath: 'id',
          autoIncrement: true
        });
        capsuleStore.createIndex('openDate', 'openDate', { unique: false });
      }
    };
  });
}

function addRecord(data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readwrite');
    const store = tx.objectStore('records');
    const req = store.add(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getAllRecords() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readonly');
    const store = tx.objectStore('records');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function deleteRecord(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readwrite');
    const store = tx.objectStore('records');
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function addCapsule(data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('capsules', 'readwrite');
    const store = tx.objectStore('capsules');
    const req = store.add(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getAllCapsules() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('capsules', 'readonly');
    const store = tx.objectStore('capsules');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function updateCapsule(data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('capsules', 'readwrite');
    const store = tx.objectStore('capsules');
    const req = store.put(data);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ==================== Tab 切换 ====================
function initTabs() {
  const navItems = document.querySelectorAll('.nav-item');
  const pages = document.querySelectorAll('.tab-page');

  navItems.forEach(item => {
    item.addEventListener('click', () => {
      const tab = item.dataset.tab;
      const activePage = document.getElementById('page-' + tab);

      // 隐藏当前页面
      const currentActive = document.querySelector('.tab-page.active');
      if (currentActive && currentActive !== activePage) {
        gsap.to(currentActive, { opacity: 0, y: 10, duration: 0.2, onComplete: () => {
          currentActive.classList.remove('active');
          currentActive.style.opacity = '';
          currentActive.style.transform = '';
        }});
      }

      navItems.forEach(n => n.classList.remove('active'));
      item.classList.add('active');

      pages.forEach(p => { if (p !== activePage) p.classList.remove('active'); });
      activePage.classList.add('active');

      gsap.fromTo(activePage, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' });

      if (tab === 'timeline') renderEmotionTimeline();
      if (tab === 'capsule') renderCapsules();
      if (tab === 'report') renderReport();
    });
  });
}

async function renderEmotionTimeline() {
  let records = await getAllRecords();
  if (records.length < 5) {
    records = generateSampleRecords();

  const dayMap = {};
  records.forEach(r => {
    const date = new Date(r.timestamp);
    const dayKey = date.getFullYear() + '-' +
      String(date.getMonth() + 1).padStart(2, '0') + '-' +
      String(date.getDate()).padStart(2, '0');
    if (!dayMap[dayKey]) dayMap[dayKey] = [];
    dayMap[dayKey].push(r.mood);
  });

  const dates = Object.keys(dayMap).sort();
  const values = dates.map(d => {
    const moods = dayMap[d];
    return +(moods.reduce((s, m) => s + m, 0) / moods.length).toFixed(2);
  });

  const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#7B8FA1';

  const topMood = Object.keys(moodCount).sort((a, b) => moodCount[b] - moodCount[a])[0];

let selectedDateType = '1';

function initCapsuleModule() {
  const dateBtns = document.querySelectorAll('.date-btn');
  dateBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      dateBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDateType = btn.dataset.years;
      const customInput = document.getElementById('customDateInput');
      if (selectedDateType === 'custom') {
        customInput.style.display = 'block';
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('customDate').min = tomorrow.toISOString().split('T')[0];
      } else {
        customInput.style.display = 'none';
      }
    });
  });

  document.getElementById('btnSaveCapsule').addEventListener('click', saveCapsule);

async function saveCapsule() {
  const content = document.getElementById('capsuleContent').value.trim();
  if (!content) {
    showToast('请写下你想对未来的自己说的话');
    return;
  }

  let openDate;
  if (selectedDateType === 'custom') {
    const dateVal = document.getElementById('customDate').value;
    if (!dateVal) {
      showToast('请选择一个日期');
      return;
    }
    openDate = new Date(dateVal).getTime();
  } else {
    const years = parseInt(selectedDateType);
    openDate = Date.now() + years * 365 * 24 * 60 * 60 * 1000;
  }

  await addCapsule({
    content: content,
    openDate: openDate,
    isRead: false,
    createdAt: Date.now()
  });

  document.getElementById('capsuleContent').value = '';
  showToast('胶囊已封存');
  renderCapsules();
}

async function renderCapsules() {
  const capsules = await getAllCapsules();
  const container = document.getElementById('capsuleList');

  if (capsules.length === 0) {
    container.innerHTML = emptyState('capsule', '还没有时间胶囊<br/>写一封给未来的自己吧');
    return;
  }

  capsules.sort((a, b) => b.createdAt - a.createdAt);

  container.innerHTML = capsules.map(c => {
    const now = Date.now();
    const isOpen = now >= c.openDate;
    const createDate = new Date(c.createdAt);
    const openDate = new Date(c.openDate);
    const createStr = createDate.getFullYear() + '/' +
      String(createDate.getMonth() + 1).padStart(2, '0') + '/' +
      String(createDate.getDate()).padStart(2, '0');
    const openStr = openDate.getFullYear() + '/' +
      String(openDate.getMonth() + 1).padStart(2, '0') + '/' +
      String(openDate.getDate()).padStart(2, '0');

    let badgeHtml, contentHtml;
    if (c.isRead) {
      badgeHtml = '<span class="badge badge-read">已阅读</span>';
      contentHtml = `<div class="capsule-content show">${escapeHtml(c.content)}</div>`;
    } else if (isOpen) {
      badgeHtml = '<span class="badge badge-ready">可以打开了！</span>';
      contentHtml = `<div class="capsule-content" id="capsule-content-${c.id}">${escapeHtml(c.content)}</div>
        <button class="btn-open-capsule" onclick="openCapsule(${c.id})">打开胶囊</button>`;
    } else {
      badgeHtml = '<span class="badge badge-pending">未到期</span>';
      contentHtml = `<div class="capsule-preview">${escapeHtml(c.content)}</div>`;
    }

    return `
      <div class="capsule-item ${isOpen && !c.isRead ? 'ready' : ''}">
        <div class="capsule-status">
          <span>封存于 ${createStr} | 开启于 ${openStr}</span>
          ${badgeHtml}
        </div>
        ${contentHtml}
      </div>
    `;
  }).join('');

  // GSAP stagger animation
  gsap.fromTo('.capsule-item', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, ease: 'power2.out' });

  // GSAP pulse for ready badges
  gsap.to('.badge-ready', { opacity: 0.6, duration: 1, repeat: -1, yoyo: true, ease: 'sine.inOut' });
}

async function openCapsule(id) {
  const capsules = await getAllCapsules();
  const capsule = capsules.find(c => c.id === id);
  if (capsule) {
    capsule.isRead = true;
    await updateCapsule(capsule);
    showToast('胶囊已打开！');
    renderCapsules();
  }
}

function extractKeywords(text, topN) {
  const wordFreq = {};
  for (let len = 2; len <= 4; len++) {
    for (let i = 0; i <= text.length - len; i++) {
      const word = text.slice(i, i + len);
      if (!/[\u4e00-\u9fff]/.test(word) || /^[\s\W]+$/.test(word) || STOP_WORDS.has(word)) continue;
      wordFreq[word] = (wordFreq[word] || 0) + 1;
    }
  }
  return Object.entries(wordFreq)
    .filter(([w, c]) => c >= 2)
    .sort((a, b) => b[1] - a[1])
    .slice(0, topN);
}

function renderKeywords(records) {
  const container = document.getElementById('keywordTags');
  const allText = records.map(r => r.text).join(' ');
  const keywords = extractKeywords(allText, 10);

  if (keywords.length === 0) {
    container.innerHTML = emptyState('keyword', '记录更多内容后<br/>将显示你的高频关键词');
    return;
  }

  container.innerHTML = keywords.map(([word, count]) =>
    `<span class="keyword-tag">${word}<span class="count">x${count}</span></span>`
  ).join('');

  // GSAP stagger animation
  gsap.fromTo('.keyword-tag', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.05, ease: 'back.out(1.5)' });
}

function renderAISummary(records) {
  const el = document.getElementById('aiSummaryText');
  const total = records.length;

  const moodCount = { 1: 0, 2: 0, 3: 0, 4: 0 };
  records.forEach(r => { if (moodCount[r.mood] !== undefined) moodCount[r.mood]++; });
  const topMoodNum = Object.keys(moodCount).sort((a, b) => moodCount[b] - moodCount[a])[0];
  const topMoodName = MOOD_NAME[topMoodNum];

  const allText = records.map(r => r.text).join(' ');
  const topKeywords = extractKeywords(allText, 3);

  let summary = `你一共记录了 ${total} 条心情。`;
  summary += `最常出现的心情是「${topMoodName}」，出现了 ${moodCount[topMoodNum]} 次。`;

  if (topKeywords.length > 0) {
    summary += topKeywords.map(([w, c]) => `你提到了「${w}」共 ${c} 次`).join('，') + '。';
  }

  const summaries = {
    1: '看起来你在这段时间里过得挺开心的，生活中充满了阳光和欢笑。继续保持这份好心情吧！',
    2: '看起来你在这段时间里保持着平和的心态，这种内心的安宁是非常珍贵的。希望你继续享受这份平静。',
    3: '看起来你在这段时间里经历了一些低谷，但请记住，低落只是暂时的。每一朵乌云背后都有阳光。',
    4: '看起来你在这段时间里承受了不少压力，别忘了给自己一些喘息的空间。深呼吸，一切都会好起来的。'
  };

  summary += summaries[topMoodNum] || '生活就是由这些点滴组成的，继续记录下去吧。';
  el.textContent = summary;
}

function renderLifeTimeline(records) {
  const container = document.getElementById('lifeTimeline');

  if (records.length === 0) {
    container.innerHTML = emptyState('timeline', '暂无记录<br/>你的人生时间轴等待开启');
    return;
  }

  records.sort((a, b) => a.timestamp - b.timestamp);

  container.innerHTML = records.map(r => {
    const date = new Date(r.timestamp);
    const dateStr = date.getFullYear() + ' 年 ' +
      (date.getMonth() + 1) + ' 月 ' +
      date.getDate() + ' 日';
    return `
      <div class="timeline-node">
        <div class="timeline-date">${dateStr}</div>
        <div class="timeline-text">${escapeHtml(r.text)}</div>
        <div class="timeline-mood">${MOOD_MAP[r.mood] || ''} ${MOOD_NAME[r.mood] || ''}</div>
      </div>
    `;
  }).join('');

  // GSAP stagger animation
  gsap.fromTo('.timeline-node', { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.08, ease: 'power2.out' });
}

// ==================== 设置中心交互 ====================
let currentSettings = null;
let pendingSettings = null;

async function initSettingsModule() {
  currentSettings = loadSettings();
  pendingSettings = { ...currentSettings };
  applySettings(currentSettings);

  document.getElementById('btnSettings').addEventListener('click', openSettings);
  document.getElementById('btnCloseSettings').addEventListener('click', closeSettings);
  document.getElementById('settingsModal').addEventListener('click', (e) => {
    if (e.target.id === 'settingsModal') closeSettings();
  });

  // 主题选择
  document.querySelectorAll('.theme-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      pendingSettings.theme = card.dataset.theme;
      applySettings({ ...pendingSettings });
    });
  });

  // 背景类型
  document.querySelectorAll('.bg-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bg-type-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      pendingSettings.bgType = btn.dataset.bgtype;
      document.getElementById('bgColorRow').style.display = pendingSettings.bgType === 'color' ? 'block' : 'none';
      document.getElementById('bgImageRow').style.display = pendingSettings.bgType === 'image' ? 'block' : 'none';
      applySettings({ ...pendingSettings });
    });
  });

  // 颜色选择
  const colorPicker = document.getElementById('bgColorPicker');
  const colorText = document.getElementById('bgColorText');
  colorPicker.addEventListener('input', () => {
    pendingSettings.bgColor = colorPicker.value;
    colorText.textContent = colorPicker.value;
    applySettings({ ...pendingSettings });
  });

  // 图片上传
  const fileInput = document.getElementById('bgFileInput');
  const fileLabel = document.getElementById('bgFileLabel');
  const fileName = document.getElementById('bgFileName');
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      showToast('图片不能超过 2MB');
      fileInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingSettings.bgImage = reader.result;
      fileLabel.classList.add('has-file');
      fileName.textContent = '已选择：' + file.name + '（点击更换）';
      applySettings({ ...pendingSettings });
    };
    reader.readAsDataURL(file);
  });

  // 模糊强度
  const blurSlider = document.getElementById('blurSlider');
  const blurValue = document.getElementById('blurValue');
  blurSlider.addEventListener('input', () => {
    pendingSettings.blur = parseInt(blurSlider.value);
    blurValue.textContent = pendingSettings.blur + 'px';
    applySettings({ ...pendingSettings });
  });

  // 卡片透明度
  const opacitySlider = document.getElementById('opacitySlider');
  const opacityValue = document.getElementById('opacityValue');
  opacitySlider.addEventListener('input', () => {
    pendingSettings.opacity = parseInt(opacitySlider.value);
    opacityValue.textContent = pendingSettings.opacity + '%';
    applySettings({ ...pendingSettings });
  });

  document.getElementById('btnSaveSettings').addEventListener('click', saveSettingsAction);

  document.getElementById('btnResetSettings').addEventListener('click', () => {
    pendingSettings = { ...DEFAULT_SETTINGS };
    syncSettingsUI();
    applySettings(pendingSettings);
    showToast('已恢复默认设置（点击保存生效）');
  });

  syncSettingsUI();
}

function syncSettingsUI() {
  document.querySelectorAll('.theme-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.theme === pendingSettings.theme);
  });
  document.querySelectorAll('.bg-type-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.bgtype === pendingSettings.bgType);
  });
  document.getElementById('bgColorRow').style.display = pendingSettings.bgType === 'color' ? 'block' : 'none';
  document.getElementById('bgImageRow').style.display = pendingSettings.bgType === 'image' ? 'block' : 'none';
  document.getElementById('bgColorPicker').value = pendingSettings.bgColor;
  document.getElementById('bgColorText').textContent = pendingSettings.bgColor;
  if (pendingSettings.bgImage) {
    document.getElementById('bgFileLabel').classList.add('has-file');
    document.getElementById('bgFileName').textContent = '已设置背景图片（点击更换）';
  } else {
    document.getElementById('bgFileLabel').classList.remove('has-file');
    document.getElementById('bgFileName').textContent = '支持 JPG / PNG，建议尺寸不超过 2MB';
  }
  document.getElementById('blurSlider').value = pendingSettings.blur;
  document.getElementById('blurValue').textContent = pendingSettings.blur + 'px';
  document.getElementById('opacitySlider').value = pendingSettings.opacity;
  document.getElementById('opacityValue').textContent = pendingSettings.opacity + '%';
}

function openSettings() {
  pendingSettings = { ...currentSettings };
  syncSettingsUI();
  const mask = document.getElementById('settingsModal');
  const modal = mask.querySelector('.modal');
  mask.classList.add('show');
  gsap.fromTo(mask, { opacity: 0 }, { opacity: 1, duration: 0.25 });
  gsap.fromTo(modal, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.5)' });
}

function closeSettings() {
  applySettings(currentSettings);
  const mask = document.getElementById('settingsModal');
  const modal = mask.querySelector('.modal');
  gsap.to(modal, { opacity: 0, scale: 0.9, duration: 0.2, ease: 'power2.in' });
  gsap.to(mask, { opacity: 0, duration: 0.2, delay: 0.05, onComplete: () => mask.classList.remove('show') });
}

async function saveSettingsAction() {
  saveSettings(pendingSettings);
  currentSettings = { ...pendingSettings };
  applySettings(currentSettings);
  chartInstances.forEach(c => { try { c.dispose(); } catch(e){} });
  chartInstances = [];
  const activeTab = document.querySelector('.nav-item.active').dataset.tab;
  if (activeTab === 'timeline') renderEmotionTimeline();
  if (activeTab === 'report') renderReport();
  closeSettings();
  showToast('设置已保存');
}

// ==================== 应用初始化 ====================
async function init() {
  try {
    await initDB();
    initTabs();
    initRecordModule();
    initCapsuleModule();
    await initSettingsModule();

    await renderRecordList();
    await initDemoCapsule();
    await renderCapsules();

    document.getElementById('btnExport').addEventListener('click', exportTimeline);

    console.log('EchoLife 初始化完成 | 纯 Web 版');
  } catch (err) {
    console.error('初始化失败:', err);
    showToast('初始化失败，请刷新页面重试');
  }
}

init();
</script>
